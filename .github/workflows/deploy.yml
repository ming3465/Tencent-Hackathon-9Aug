name: Deploy Kampung SG to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 2026-08-06: GitHub Pages deployments are aborting after the deploy step
# polls deployment_in_progress past the action's limit. This is NOT caused by
# the action versions below - the exact workflow that had deployed
# successfully an hour earlier was restored and failed identically. The
# deployments do land: the live bundle contained the new code each time, the
# action just gives up waiting and reports failure.
#
# So: verify a release by fetching the live URL and checking the served bundle,
# not by trusting this workflow's conclusion, until Pages recovers.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the local development runtime, so what is verified here is
          # what CI builds. scripts/browser-smoke.mjs requires Node 22+.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      # v4 stopped including dotfiles in the artifact. Checked: the Vite build
      # emits none (index.html, iso-preview.html, assets/), so this is safe.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The Pages backend is currently taking longer than the 10-minute
          # default to finish a deployment. The action gave up and reported
          # failure on three runs while the deployment itself completed - the
          # live bundle contained the new code each time. Waiting longer turns
          # that false negative back into a truthful signal.
          timeout: 1800000
