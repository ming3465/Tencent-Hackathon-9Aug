name: Deploy Kampung SG to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the local development runtime, so what is verified here is
          # what CI builds. scripts/browser-smoke.mjs requires Node 22+.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      # v4 stopped including dotfiles in the artifact. Checked: the Vite build
      # emits none (index.html, iso-preview.html, assets/), so this is safe.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # Held at v4 deliberately. v5 timed out waiting on the Pages backend
        # on two consecutive runs (deployment_queued / deployment_in_progress
        # for the full 10 minutes, then aborted), while v4 has deployed this
        # repository reliably. A working deploy to the judged URL outranks
        # clearing this one action's Node-20 annotation.
        uses: actions/deploy-pages@v4
