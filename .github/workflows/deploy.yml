name: Deploy Kampung SG to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Action versions are deliberately held at the set that deploys this
# repository reliably, despite GitHub's Node 20 runtime-deprecation
# annotation. Bumping all five (checkout v7, setup-node v7, configure-pages
# v6, upload-pages-artifact v5, deploy-pages v5) was tried on 2026-08-06 and
# made every deployment abort: the build passed and the artifact uploaded, but
# the deploy step sat in deployment_in_progress until it gave up and cancelled.
# Raising deploy-pages' `timeout` input did not help - it still aborted at ten
# minutes - and pinning deploy-pages back to v4 alone did not either, so the
# cause is upstream of that action. The annotation is cosmetic; a deploy that
# cancels itself is not. Revisit after the submission window.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
